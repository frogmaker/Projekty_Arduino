<text x="90" y="76.0" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#183845" text-anchor="start">EKG — schemat połączeń elektrycznych</text>
<text x="60" y="120.0" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#183845" text-anchor="start">Arduino UNO R3 · Olimex SHIELD-EKG/EMG rev. B · sygnały przechodzą przez listwy nakładki · zworka REF_E otwarta</text>
<text x="290" y="286.0" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#183845" text-anchor="middle">Arduino UNO</text>
<text x="290" y="320.0" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#576c77" text-anchor="middle">ATmega328P · 5 V</text>
<text x="290" y="351.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#576c77" text-anchor="middle">ADC 10 bit: 0…1023</text>
<text x="442" y="421.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#183845" text-anchor="end">5V</text>
<text x="442" y="501.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#183845" text-anchor="end">GND</text>
<text x="442" y="581.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#183845" text-anchor="end">A0</text>
<text x="290" y="639.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#183845" text-anchor="middle">AREF: bez zewnętrznego</text>
<text x="290" y="666.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#183845" text-anchor="middle">napięcia z nakładki</text>
<text x="290" y="694.0" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#576c77" text-anchor="middle">analogReference: DEFAULT</text>
<text x="1117" y="286.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#183845" text-anchor="middle">Olimex SHIELD-EKG/EMG</text>
<text x="1117" y="321.0" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#d72f3f" text-anchor="middle">Zworka zasilania: 5V</text>
<text x="900" y="421.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#183845" text-anchor="start">5V → VCCA</text>
<text x="900" y="501.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#183845" text-anchor="start">GND</text>
<text x="900" y="581.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#183845" text-anchor="start">OUT → AIN_SEL 1–2 → A0</text>
<text x="1117" y="367.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#576c77" text-anchor="middle">Wzmacniacz + filtry analogowe</text>
<text x="1117" y="640.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#ad2c40" text-anchor="middle">REF_E: OTWARTA</text>
<text x="956" y="685.0" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#576c77" text-anchor="end">ref. ≈3 V</text>
<text x="1137" y="686.0" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#576c77" text-anchor="start">AREF</text>
<text x="1334" y="401.0" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#183845" text-anchor="end">L</text>
<text x="1747" y="454.0" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#d72f3f" text-anchor="end">L · czerwony · lewa ręka</text>
<text x="1334" y="481.0" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#183845" text-anchor="end">R</text>
<text x="1747" y="534.0" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#637b88" text-anchor="end">R · biały · prawa ręka</text>
<text x="1334" y="561.0" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#183845" text-anchor="end">DRL</text>
<text x="1747" y="614.0" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#242a32" text-anchor="end">DRL · czarny · prawa noga</text>
<text x="1440" y="763.0" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#183845" text-anchor="middle">Kompletny przewód PRO + jack 3,5 mm do CH_IN.</text>
<text x="1440" y="792.0" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#576c77" text-anchor="middle">DRL nie łącz z GND. Bez przypisywania styków TRS.</text>
<text x="668" y="365.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#183845" text-anchor="middle">Złącza listwowe UNO ↔ shield</text>
<text x="670" y="643.0" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#576c77" text-anchor="middle">Nie dokładaj tu przewodów.</text>
<text x="145" y="850.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#183845" text-anchor="start">Ustawienia dla oryginalnego programu</text>
<text x="145" y="888.0" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#183845" text-anchor="start">3.3V/5V: 5V     AIN_SEL: 1–2 / A0     REF_E: otwarta     CAL: otwarta</text>
<text x="145" y="924.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#576c77" text-anchor="start">D4/D9 pozostaje D9; program nie steruje kalibracją. TR1 pozostaw fabrycznie ustawiony.</text>
<text x="145" y="961.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#183845" text-anchor="start">USB-B UNO → laptop: zasilanie 5 V i dane 115200 bit/s. Gniazdo DC pozostaje puste.</text>
<text x="145" y="997.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#576c77" text-anchor="start">Środek sygnału analogowego ≈1,5 V; przy AVCC=5 V to około 307 zliczeń ADC, nie 512.</text>
<text x="77" y="1114.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#7d3c25" text-anchor="start">ELEKTRODY NA SKÓRZE: laptop tylko na baterii; odłącz ładowarkę, stację dokującą i pozostałe kable.</text>
<text x="77" y="1144.0" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#7d3c25" text-anchor="start">Bez zasilacza, oscyloskopu i innego połączenia ze sprzętem sieciowym. Układ edukacyjny, nie do diagnozy.</text>
<text x="60" y="1184.0" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#576c77" text-anchor="start">Wariant schematu: oryginalny szkic, odniesienie ADC DEFAULT/AVCC; REF_E otwarta. Źródła i ograniczenia: README.md.</text>
</svg>